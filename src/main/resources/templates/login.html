<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход в систему</title>
</head>
<body>
<h2>Вход</h2>
<div th:if="${param.error}" style="color: red;">Неверный логин или пароль</div>
<div th:if="${param.logout}" style="color: green;">Вы успешно вышли из системы</div>
<div th:if="${param.success}" style="color: green;">Регистрация прошла успешно! Войдите.</div>

<form th:action="@{/login}" method="post">
    <div>
        <label>Логин: </label>
        <input type="text" name="username" required />
    </div>
    <div>
        <label>Пароль: </label>
        <input type="password" name="password" required />
    </div>
    <button type="submit">Войти</button>
</form>
<p>Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
</body>
</html>
